<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#12151b" rx="8"/>
  <rect x="20" y="20" width="760" height="410" fill="#18231c" stroke="#2ecc71" stroke-width="2" rx="6"/>
  <text x="400" y="70" text-anchor="middle" fill="#d4af37" font-family="Georgia, serif" font-size="24" font-weight="bold">Screenshot: Victory Escape Sequence</text>
  <rect x="150" y="100" width="500" height="45" rx="6" fill="#0e5c6e" stroke="#148099"/>
  <text x="400" y="128" text-anchor="middle" fill="#7df5ff" font-family="sans-serif" font-size="16" font-weight="bold">🎉 CONGRATULATIONS! You have escaped the locked study!</text>
  <rect x="60" y="170" width="680" height="150" rx="6" fill="#1a1e26" stroke="#2a4365"/>
  <text x="80" y="205" fill="#ffd97d" font-family="sans-serif" font-size="13" font-weight="bold">🧙‍♂️ Game Master (Narrator):</text>
  <text x="80" y="235" fill="#e2e8f0" font-family="Georgia, serif" font-size="13">"With a resounding mechanical chime, the heavy iron tumblers slide back into the door frame!</text>
  <text x="80" y="260" fill="#e2e8f0" font-family="Georgia, serif" font-size="13">The massive oak exit door swings wide, pouring brilliant morning sunlight into the gloomy archivist's study.</text>
  <text x="80" y="285" fill="#e2e8f0" font-family="Georgia, serif" font-size="13">Cool fresh air rushes in as you step triumphantly across the threshold. Congratulations — you have escaped!"</text>
  <text x="400" y="380" text-anchor="middle" fill="#68d391" font-family="sans-serif" font-size="14">State Invariant Met: Puzzles Cleared 4/4 • Keypad Code 4207 Verified • Door: OPEN</text>
</svg>
