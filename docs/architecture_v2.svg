<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10141c"/>
      <stop offset="100%" stop-color="#18202d"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212a38"/>
      <stop offset="100%" stop-color="#161c25"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e7e44"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d4af37"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2ecc71"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" fill="url(#bgGrad2)" rx="12"/>
  <rect x="20" y="20" width="920" height="520" fill="none" stroke="#2a4365" stroke-width="2" rx="10"/>

  <!-- Title -->
  <text x="480" y="55" text-anchor="middle" fill="#d4af37" font-family="'Georgia', serif" font-size="23" font-weight="bold" letter-spacing="1">
    VERSION 2: RELIABLE ARCHITECTURE (STATE ENGINE + CONSTRAINED NARRATOR)
  </text>
  <text x="480" y="80" text-anchor="middle" fill="#a0aec0" font-family="'Helvetica Neue', sans-serif" font-size="13">
    Deterministic Python Action Validation • External Ground Truth • LLM Constrained to Atmospheric Narration
  </text>

  <!-- Component 1: Player / User -->
  <g transform="translate(40, 160)" filter="url(#shadow2)">
    <rect width="160" height="170" rx="8" fill="url(#cardGrad2)" stroke="#4a5568" stroke-width="2"/>
    <rect width="160" height="35" rx="8" fill="#2d3748"/>
    <text x="80" y="24" text-anchor="middle" fill="#e2e8f0" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="bold">PLAYER (USER)</text>
    <circle cx="80" cy="70" r="18" fill="#4a5568"/>
    <text x="80" y="110" text-anchor="middle" fill="#cbd5e0" font-size="12">Natural Language</text>
    <text x="80" y="130" text-anchor="middle" fill="#cbd5e0" font-size="12">Action / Inquiries</text>
    <text x="80" y="150" text-anchor="middle" fill="#718096" font-size="10">(Or Adversarial Attack)</text>
  </g>

  <!-- Component 2: Streamlit Interface -->
  <g transform="translate(240, 140)" filter="url(#shadow2)">
    <rect width="190" height="210" rx="8" fill="url(#cardGrad2)" stroke="#d4af37" stroke-width="2"/>
    <rect width="190" height="35" rx="8" fill="url(#goldGrad2)"/>
    <text x="95" y="24" text-anchor="middle" fill="#12151b" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="bold">STREAMLIT UI &amp; HUD</text>
    <text x="95" y="65" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Live Sidebar HUD</text>
    <text x="95" y="88" text-anchor="middle" fill="#a0aec0" font-size="11">🎒 Real-time Inventory</text>
    <text x="95" y="110" text-anchor="middle" fill="#a0aec0" font-size="11">🔍 Object Statuses</text>
    <text x="95" y="132" text-anchor="middle" fill="#a0aec0" font-size="11">📊 Puzzle Progress Bar</text>
    <text x="95" y="154" text-anchor="middle" fill="#a0aec0" font-size="11">🛡️ Interception Badges</text>
    <text x="95" y="180" text-anchor="middle" fill="#cbd5e0" font-size="11">Interactive Chat Stream</text>
  </g>

  <!-- Component 3: Deterministic Engine (Python) -->
  <g transform="translate(470, 130)" filter="url(#shadow2)">
    <rect width="230" height="230" rx="8" fill="url(#cardGrad2)" stroke="#2ecc71" stroke-width="2"/>
    <rect width="230" height="35" rx="8" fill="url(#greenGrad)"/>
    <text x="115" y="24" text-anchor="middle" fill="#fff" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="bold">PYTHON RULES ENGINE</text>
    <text x="115" y="60" text-anchor="middle" fill="#68d391" font-size="12" font-weight="bold">ActionValidator &amp; GameState</text>
    <text x="115" y="85" text-anchor="middle" fill="#e2e8f0" font-size="11">✓ Precondition Verification</text>
    <text x="115" y="105" text-anchor="middle" fill="#e2e8f0" font-size="11">✓ Inventory Enforcement</text>
    <text x="115" y="125" text-anchor="middle" fill="#e2e8f0" font-size="11">✓ Code Tumbler Matcher</text>
    <text x="115" y="145" text-anchor="middle" fill="#e2e8f0" font-size="11">✓ Regex Anti-Injection Filter</text>
    <text x="115" y="165" text-anchor="middle" fill="#e2e8f0" font-size="11">✓ External Secrets (7392, 4207)</text>
    <rect x="20" y="185" width="190" height="30" rx="4" fill="#1c3a27"/>
    <text x="115" y="205" text-anchor="middle" fill="#81e6d9" font-size="11" font-weight="bold">DETERMINISTIC VERDICT</text>
  </g>

  <!-- Component 4: Gemini LLM (Constrained Narrator) -->
  <g transform="translate(740, 150)" filter="url(#shadow2)">
    <rect width="180" height="190" rx="8" fill="url(#cardGrad2)" stroke="#3498db" stroke-width="2"/>
    <rect width="180" height="35" rx="8" fill="url(#blueGrad)"/>
    <text x="90" y="24" text-anchor="middle" fill="#fff" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="bold">GEMINI NARRATOR</text>
    <text x="90" y="60" text-anchor="middle" fill="#90cdf4" font-size="11" font-weight="bold">Constrained LLM Role</text>
    <text x="90" y="85" text-anchor="middle" fill="#cbd5e0" font-size="11">Receives Ground Truth</text>
    <text x="90" y="105" text-anchor="middle" fill="#cbd5e0" font-size="11">+ Factual Outcome</text>
    <text x="90" y="130" text-anchor="middle" fill="#a0aec0" font-size="11">Produces Atmospheric</text>
    <text x="90" y="150" text-anchor="middle" fill="#a0aec0" font-size="11">Victorian Prose</text>
    <text x="90" y="172" text-anchor="middle" fill="#68d391" font-size="10">🔒 Cannot Alter State</text>
  </g>

  <!-- Arrows -->
  <!-- User to UI -->
  <path d="M 200 220 L 230 220" fill="none" stroke="#d4af37" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- UI to Engine -->
  <path d="M 430 220 L 460 220" fill="none" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="445" y="210" text-anchor="middle" fill="#2ecc71" font-size="10">Validate</text>

  <!-- Engine to LLM -->
  <path d="M 700 220 L 730 220" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="715" y="210" text-anchor="middle" fill="#3498db" font-size="10">Verdict</text>

  <!-- LLM back to UI -->
  <path d="M 830 340 L 830 400 L 335 400 L 335 360" fill="none" stroke="#90cdf4" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="580" y="395" text-anchor="middle" fill="#90cdf4" font-size="11">Gothic Atmospheric Prose Narration</text>

  <!-- UI back to User -->
  <path d="M 240 280 L 210 280" fill="none" stroke="#d4af37" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="225" y="270" text-anchor="middle" fill="#d4af37" font-size="10">Render</text>

  <!-- Bottom Key Highlights -->
  <g transform="translate(40, 440)">
    <rect width="880" height="75" rx="6" fill="#142330" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="440" y="24" text-anchor="middle" fill="#63b3ed" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="bold">
      ARCHITECTURAL GUARANTEES OF VERSION 2:
    </text>
    <text x="440" y="46" text-anchor="middle" fill="#e2e8f0" font-family="'Helvetica Neue', sans-serif" font-size="11">
      1. Zero Prompt Injection Exploits • 2. 100% Inventory &amp; Precondition Integrity • 3. Immutable Puzzle Secrets Stored in Python
    </text>
    <text x="440" y="64" text-anchor="middle" fill="#a0aec0" font-family="'Helvetica Neue', sans-serif" font-size="11">
      4. Decoupled Logic: Python enforces reality, while Generative LLM powers storytelling immersion.
    </text>
  </g>
</svg>
